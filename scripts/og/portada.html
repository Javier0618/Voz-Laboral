<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada de guía · TuVozLaboral</title>
<!-- Plantilla de portada de guía (1200×628). Se llena y se exporta con: node scripts/og/generar-portada.cjs -->
<style>
@font-face { font-family: 'Roboto'; src: url('../../node_modules/@fontsource-variable/roboto/files/roboto-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
@font-face { font-family: 'Instrument Sans'; src: url('../../node_modules/@fontsource-variable/instrument-sans/files/instrument-sans-latin-wght-normal.woff2') format('woff2'); font-weight: 400 700; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 628px; overflow: hidden; }
body { background: #0F2440; color: #fff; font-family: 'Roboto', system-ui, sans-serif; position: relative; -webkit-font-smoothing: antialiased; }
.wrap { position: absolute; inset: 0; padding: 64px 80px 68px; display: flex; flex-direction: column; justify-content: space-between; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
.brand { font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 38px; font-weight: 700; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
.brand svg.o { display: inline-block; height: .74em; width: auto; vertical-align: -.13em; margin: 0 .01em; }
.brand svg.wv { display: inline-block; height: .56em; width: auto; vertical-align: .25em; margin: 0 -.02em 0 .01em; overflow: visible; transform: rotate(-45deg); transform-origin: 0% 60%; }
.brand .lab { font-weight: 450; color: rgba(255,255,255,.8); }
.tema { border: 2px solid rgba(255,255,255,.28); border-radius: 999px; padding: 9px 22px; font-size: 22px; font-weight: 600; color: #DCE6F0; white-space: nowrap; }
.main { display: flex; align-items: flex-end; justify-content: space-between; gap: 48px; }
h1 { font-family: 'Roboto', system-ui, sans-serif; font-weight: 700; line-height: 1.06; letter-spacing: -.015em; max-width: 720px; }
.dato { flex: none; max-width: 330px; text-align: right; }
.dato b { display: block; font-family: 'Roboto', system-ui, sans-serif; font-weight: 800; font-size: 100px; line-height: .95; color: #5FD3C5; letter-spacing: -.02em; }
.dato span { display: block; margin-top: 12px; font-size: 24px; font-weight: 600; color: #DCE6F0; line-height: 1.25; }
.foot { display: flex; align-items: center; justify-content: space-between; font-size: 22px; color: #9FB3C8; }
.foot .url { font-weight: 700; color: #5FD3C5; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 12px; background: #0F766E; }
.redact { position: absolute; right: 80px; top: 150px; display: grid; gap: 12px; justify-items: end; opacity: .14; }
.redact span { display: block; height: 16px; border-radius: 3px; background: #fff; }
</style>
</head>
<body>
<div class="redact" aria-hidden="true"><span style="width:300px"></span><span style="width:220px"></span><span style="width:260px"></span></div>
<div class="wrap">
  <div class="top">
    <div class="brand">tuv<svg class="o" viewBox="1.1 2.4 19.9 19.4"><path d="M11 4.2a7.3 7.3 0 1 1-4.9 12.8L3 19.6l1-4.2A7.3 7.3 0 0 1 11 4.2z" fill="#2BB3A5" stroke="#2BB3A5" stroke-width="1.6" stroke-linejoin="round"/><circle cx="8" cy="11.5" r="1.3" fill="#0F2440"/><circle cx="11.2" cy="11.5" r="1.3" fill="#0F2440"/><circle cx="14.4" cy="11.5" r="1.3" fill="#0F2440"/></svg>z<svg class="wv" viewBox="0 0 17 20" fill="none" stroke="#2BB3A5" stroke-width="2.6" stroke-linecap="round"><path d="M2 6.5a5 5 0 0 1 0 7"/><path d="M6.5 3a10 10 0 0 1 0 14"/><path d="M11 0a14.5 14.5 0 0 1 0 20" stroke-opacity=".5"/></svg><span class="lab">laboral</span></div>
    <div class="tema" id="tema">Tema</div>
  </div>
  <div class="main">
    <h1 id="titulo">Título de la guía</h1>
    <div class="dato" id="dato"><b id="dato-valor">0</b><span id="dato-texto">dato</span></div>
  </div>
  <div class="foot"><span id="pie">Guía verificada con la fuente oficial</span><span class="url">tuvozlaboral.com</span></div>
</div>
<div class="bar"></div>
</body>
</html>
